PYOMO_OPTIONS:
  gurobi:
    'OutputFlag': 0
    'LogToConsole': 0
    'InfUnbdInfo': 1
    'QCPDual': 1
  gurobi_direct:
    'OutputFlag': 0
    'LogToConsole': 0
    'InfUnbdInfo': 1
    'QCPDual': 1
  scip:
    'presolving/maxrounds': 0
    'separating/maxrounds': 0
    'propagating/maxrounds': 0
    'lp/alwaysgetduals': True

GUROBI_OPTIONS:
  # Hide solver output
  'OutputFlag': 0
  'LogToConsole': 0
  # Get Model.FarkasDual requires InfUnbdInfo = 1
  'InfUnbdInfo': 1
  # QCPi requires QCPDual = 1
  'QCPDual': 1
  # Gurobi model status code 4 (INF_OR_UNBD)
  'DualReductions': 0

SCIP_OPTIONS:
  # Get Farkas duals for infeasible problems
  'lp/alwaysgetduals': True

CPLEXCP_OPTIONS:
  # Hide solver output
  'log_output': None

COPT_OPTIONS:
  # Hide solver output
  'Logging': 0
  'LogToConsole': 0
  # Request Farkas dual for infeasible problems
  'ReqFarkasRay': 1

CPLEX_OPTIONS:
  # Parameters for obtaining Farkas certificate
  'preprocessing.presolve': 0
  'lpmethod': 2

STATUS_CODES:
  'COPT':
    1: 'OPTIMAL'
    2: 'INFEASIBLE'
    3: 'UNBOUNDED'

  'CPLEX':
    1: 'OPTIMAL'
    101: 'OPTIMAL'
    3: 'INFEASIBLE'
    103: 'INFEASIBLE'
    2: 'UNBOUNDED'
    118: 'UNBOUNDED'
    102: 'OPTIMAL'  # OPTIMAL_TOL

  'CPLEXCP':
    'optimal': 'OPTIMAL'
    'infeasible': 'INFEASIBLE'
    'feasible': 'OPTIMAL'  # FEASIBLE

  'GUROBI':
    2: 'OPTIMAL'
    3: 'INFEASIBLE'
    5: 'UNBOUNDED'

  'ORTOOLS':
    4: 'OPTIMAL'
    3: 'INFEASIBLE'
    2: ‘OPTIMAL'  # FEASIBLE

  'SCIP':
    'optimal': 'OPTIMAL'
    'infeasible': 'INFEASIBLE'
    'unbounded': 'UNBOUNDED'

  'PYOMO':
    'optimal': 'OPTIMAL'
    'infeasible': 'INFEASIBLE'
    'unbounded': 'UNBOUNDED'